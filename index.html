{cat:'景点',zh:'阿卡萨人妖秀',en:'Alcazar Cabaret Show',th:'อัลคาซ่าร์ คาบาเร่ต์',address:'78/14 Pattaya 2nd Road, Pattaya, Chon Buri, Thailand',q:'Alcazar Cabaret Pattaya'},
{cat:'景点',zh:'芭提雅海滩',en:'Pattaya Beach',th:'หาดพัทยา',address:'Pattaya Beach Road, Pattaya, Chon Buri, Thailand',q:'Pattaya Beach'}
];
let addressCategory='全部',driverIndex=null;
function addressCard(a,i){return `<article class="addresscard"><div class="sub">${esc(a.cat)} · 司机目的地卡</div><h3>${esc(a.zh)}</h3><div class="lang">ภาษาไทย · 泰语</div><div class="bigthai" lang="th">${esc(a.th)}</div><div class="lang">ENGLISH</div><div class="addr">${esc(a.en)}</div><div class="lang">地址 / ADDRESS</div><div class="addr">${esc(a.address)}</div>${a.note?`<p class="notice">${esc(a.note)}</p>`:''}<div class="actions"><button data-showdriver="${i}">全屏给司机看</button><button data-copyaddress="${i}">复制泰语＋地址</button><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.q)}">打开地图 ↗</a></div></article>`}
function addresses(){if(driverIndex!==null){const a=ADDRESSES[driverIndex];return `<section class="section"><button class="driver-back" data-backdriver="1">← 返回地址列表</button>${addressCard(a,driverIndex)}</section>`}return `<section class="section"><h2>司机地址卡</h2><p class="sub">点“全屏给司机看”，可直接展示泰语地名及地址。地图定位和酒店门牌建议与订单核对。</p><div class="foodfilters">${['全部','酒店','机场','景点'].map(x=>`<button class="filter ${addressCategory===x?'active':''}" data-addrcat="${x}">${x}</button>`).join('')}</div>${ADDRESSES.map((a,i)=>({...a,i})).filter(a=>addressCategory==='全部'||a.cat===addressCategory).map(a=>addressCard(a,a.i)).join('')}</section>`}
const state={view:'days',day:0,food:'全部'};
const storeKey='thailand-pocket-trip-2026-v1';let checked={};try{checked=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setCheck(k,v){checked[k]=v;try{localStorage.setItem(storeKey,JSON.stringify(checked))}catch(e){}update();}
function check(k,label){return `<label class="checkrow"><input class="tick" type="checkbox" data-check="${esc(k)}" ${checked[k]?'checked':''}><span class="${checked[k]?'checked':''}">${esc(label)}</span></label>`}
function progress(keys){let n=keys.filter(k=>checked[k]).length;return `<div class="sub">已完成 ${n} / ${keys.length}</div><div class="progress"><div class="bar" style="width:${keys.length?100*n/keys.length:0}%"></div></div>`}
function day(){const d=DATA.days[state.day];let keys=d.events.map((_,i)=>`day-${state.day}-${i}`);return `<div class="tabs">${DATA.days.map((x,i)=>`<button class="tab ${state.day===i?'active':''}" data-day="${i}"><b>${x.date}</b><small>${x.weekday}</small></button>`).join('')}</div><section class="section"><div class="dayhead"><div><div class="sub">DAY ${state.day+1} / 8</div><h2>${esc(d.title)}</h2></div><span class="datechip">${d.date} ${d.weekday}</span></div><div class="stay">⌂ ${esc(d.stay)}</div>${progress(keys)}${d.events.map((e,i)=>{const k=keys[i],has=!!e.imageQuery;return `<article class="event"><div class="time">${esc(e.time)}</div><div class="eventcard"><div class="eventtop"><input aria-label="完成 ${esc(e.name)}" class="tick" type="checkbox" data-check="${k}" ${checked[k]?'checked':''}><div class="eventtext"><span class="type">${esc(e.type)}</span><div class="eventname ${checked[k]?'checked':''}">${esc(e.name)}</div><div class="eventdesc">${esc(e.detail)}</div></div>${has?`<button class="expand" data-expand="${i}" aria-expanded="false">了解 ↗</button>`:''}</div>${has?`<div class="detail" id="detail-${i}"><div class="imgfallback" id="fallback-${i}">图片暂时无法加载 · 可打开地图查看实景</div><img class="spotimage" alt="${esc(e.name)} 图片" loading="lazy" data-wiki="${esc(e.imageQuery)}" data-fallback="fallback-${i}"><p>${esc(e.intro||e.detail)}</p><a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.imageQuery)}">查看 Google 地图 ↗</a></div>`:''}</div></article>`}).join('')}<div class="notice">提醒：景点开放时间、演出场次、灯光秀及交通信息以出发前官方公布为准。11月25日厦门过夜已计入行程。</div></section>`}
function checklist(obj,prefix,title){const keys=Object.entries(obj).flatMap(([g,items])=>items.map((_,i)=>`${prefix}-${g}-${i}`));return `<section class="section"><h2>${title}</h2><p class="sub">点击方框勾选；进度自动保存在当前浏览器。</p>${progress(keys)}${Object.entries(obj).map(([g,items])=>`<div class="group"><div class="gtitle">${esc(g)} <span>${items.filter((_,i)=>checked[`${prefix}-${g}-${i}`]).length}/${items.length}</span></div>${items.map((v,i)=>check(`${prefix}-${g}-${i}`,v)).join('')}</div>`).join('')}<div class="tools"><button class="tool" data-export="${prefix}">复制未完成事项</button></div></section>`}
function food(){const cats=['全部','午餐简餐','晚餐正餐','下酒小菜'];const list=DATA.food.map((x,i)=>({...x,i})).filter(x=>state.food==='全部'||x.category===state.food);const keys=DATA.food.map((_,i)=>`food-${i}`);return `<section class="section"><h2>泰国特色美食打卡</h2><p class="sub">以菜式为单位勾选，适合边旅行边记录。标注“相对友好”并不等于低GI认证；主食份量、甜酱和饮品仍会影响血糖。</p>${progress(keys)}<div class="foodfilters">${cats.map(c=>`<button class="filter ${c===state.food?'active':''}" data-food="${c}">${c}</button>`).join('')}</div>${list.map(x=>`<div class="foodcard">${check(`food-${x.i}`,x.name)}<div class="fooddesc">${esc(x.desc)}</div><span class="foodtag ${/风险|碳水较多/.test(x.tag)?'warn':''}">${esc(x.tag)}</span></div>`).join('')}<div class="notice">生腌虾、血蚶等生食有感染风险，老人建议选择彻底煮熟的版本。饮酒与用药、血糖管理之间可能存在相互影响。</div></section>`}
function update(){document.querySelectorAll('[data-check]').forEach(el=>{const k=el.dataset.check;el.checked=!!checked[k];const text=el.closest('.checkrow')?.querySelector('span')||el.closest('.eventtop')?.querySelector('.eventname');if(text)text.classList.toggle('checked',!!checked[k])});if(state.view!=='days')render(false);else{const d=DATA.days[state.day],keys=d.events.map((_,i)=>`day-${state.day}-${i}`),p=document.querySelector('.section .progress .bar'),s=document.querySelector('.section>.sub + .progress');if(p)p.style.width=`${keys.filter(k=>checked[k]).length/keys.length*100}%`;const txt=document.querySelector('.section .stay + .sub');if(txt)txt.textContent=`已完成 ${keys.filter(k=>checked[k]).length} / ${keys.length}`}}
function render(scroll=true){document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));document.body.classList.toggle('driver-mode',state.view==='address'&&driverIndex!==null);document.getElementById('main').innerHTML=state.view==='days'?day():state.view==='pre'?checklist(DATA.pre,'pre','出发前 Checklist'):state.view==='return'?checklist(DATA.return,'return','回程前 Checklist'):state.view==='food'?food():addresses();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
const cache={};async function loadWiki(img){if(img.dataset.loaded)return;img.dataset.loaded='1';let q=img.dataset.wiki;try{if(!cache[q]){const url='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=1&prop=pageimages&pithumbsize=900&format=json&origin=*';const res=await fetch(url);const j=await res.json();cache[q]=Object.values(j.query?.pages||{})[0]?.thumbnail?.source||'';}if(!cache[q])throw Error('No image');img.src=cache[q];img.onerror=()=>{img.style.display='none';document.getElementById(img.dataset.fallback)?.style.setProperty('display','block')}}catch(e){img.style.display='none';document.getElementById(img.dataset.fallback)?.style.setProperty('display','block')}} 
document.addEventListener('click',async e=>{let b=e.target.closest('[data-view],[data-day],[data-food],[data-expand],[data-export],[data-addrcat],[data-showdriver],[data-backdriver],[data-copyaddress]');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;driverIndex=null;render()}else if(b.dataset.addrcat){addressCategory=b.dataset.addrcat;render(false)}else if(b.dataset.showdriver!==undefined){driverIndex=Number(b.dataset.showdriver);render()}else if(b.dataset.backdriver!==undefined){driverIndex=null;render()}else if(b.dataset.copyaddress!==undefined){const a=ADDRESSES[Number(b.dataset.copyaddress)];try{await navigator.clipboard.writeText(a.th+'\n'+a.en+'\n'+a.address);b.textContent='已复制'}catch(err){b.textContent='复制失败'}}else if(b.dataset.day!==undefined){state.day=Number(b.dataset.day);render()}else if(b.dataset.food){state.food=b.dataset.food;render(false)}else if(b.dataset.expand!==undefined){let box=document.getElementById('detail-'+b.dataset.expand);box.classList.toggle('open');b.setAttribute('aria-expanded',box.classList.contains('open'));b.textContent=box.classList.contains('open')?'收起 ↑':'了解 ↗';if(box.classList.contains('open')){const img=box.querySelector('[data-wiki]');if(img)loadWiki(img)}}else if(b.dataset.export){const obj=b.dataset.export==='pre'?DATA.pre:DATA.return;const lines=Object.entries(obj).flatMap(([g,items])=>[g,...items.filter((_,i)=>!checked[`${b.dataset.export}-${g}-${i}`]).map(x=>'☐ '+x)]);try{await navigator.clipboard.writeText(lines.join('\n'));b.textContent='已复制'}catch(e){b.textContent='复制失败，请手动选择'}}});document.addEventListener('change',e=>{if(e.target.dataset.check)setCheck(e.target.dataset.check,e.target.checked)});render();
</script></body></html>
