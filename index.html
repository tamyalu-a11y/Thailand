function addressCard(a,i){return `<article class="addresscard"><div class="sub">${esc(a.cat)} · 司机目的地卡</div><h3>${esc(a.zh)}</h3><div class="lang">ภาษาไทย · 泰语</div><div class="bigthai" lang="th">${esc(a.th)}</div><div class="lang">ENGLISH</div><div class="addr">${esc(a.en)}</div><div class="lang">地址 / ADDRESS</div><div class="addr">${esc(a.address)}</div>${a.note?`<p class="notice">${esc(a.note)}</p>`:''}<div class="actions"><button data-showdriver="${i}">全屏给司机看</button><button data-copyaddress="${i}">复制泰语＋地址</button><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.q)}">打开地图 ↗</a></div></article>`}
function addresses(){if(driverIndex!==null){const a=ADDRESSES[driverIndex];return `<section class="section"><button class="driver-back" data-backdriver="1">← 返回地址列表</button>${addressCard(a,driverIndex)}</section>`}return `<section class="section"><h2>司机地址卡</h2><p class="sub">点“全屏给司机看”，可直接展示泰语地名及地址。地图定位和酒店门牌建议与订单核对。</p><div class="foodfilters">${['全部','酒店','机场','景点'].map(x=>`<button class="filter ${addressCategory===x?'active':''}" data-addrcat="${x}">${x}</button>`).join('')}</div>${ADDRESSES.map((a,i)=>({...a,i})).filter(a=>addressCategory==='全部'||a.cat===addressCategory).map(a=>addressCard(a,a.i)).join('')}</section>`}

function day(){const d=DATA.days[state.day];let keys=d.events.map((_,i)=>`day-${state.day}-${i}`);return `<div class="tabs">${DATA.days.map((x,i)=>`<button class="tab ${state.day===i?'active':''}" data-day="${i}"><b>${x.date}</b><small>${x.weekday}</small></button>`).join('')}</div><section class="section"><div class="dayhead"><div><div class="sub">DAY ${state.day+1} / 8</div><h2>${esc(d.title)}</h2></div><span class="datechip">${d.date} ${d.weekday}</span></div><div class="stay">⌂ ${esc(d.stay)}</div>${progress(keys)}${d.events.map((e,i)=>{const k=keys[i],has=!!e.imageQuery;return `<article class="event"><div class="time">${esc(e.time)}</div><div class="eventcard"><div class="eventtop"><input aria-label="完成 ${esc(e.name)}" class="tick" type="checkbox" data-check="${k}" ${checked[k]?'checked':''}><div class="eventtext"><span class="type">${esc(e.type)}</span><div class="eventname ${checked[k]?'checked':''}">${esc(e.name)}</div><div class="eventdesc">${esc(e.detail)}</div></div>${has?`<button class="expand" data-expand="${i}" aria-expanded="false">了解 ↗</button>`:''}</div>${has?`<div class="detail" id="detail-${i}"><div class="imgfallback" id="fallback-${i}">图片暂时无法加载 · 可打开地图查看实景</div><img class="spotimage" alt="${esc(e.name)} 图片" loading="lazy" data-wiki="${esc(e.imageQuery)}" data-fallback="fallback-${i}"><p>${esc(e.intro||e.detail)}</p><a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.imageQuery)}">查看 Google 地图 ↗</a></div>`:''}</div></article>`}).join('')}${nearbyRestaurants(state.day)}</section>`}
let checkMode='pre';
function combinedChecklist(){return `<div class="tabs"><button class="tab ${checkMode==='pre'?'active':''}" data-checkmode="pre">出发准备</button><button class="tab ${checkMode==='return'?'active':''}" data-checkmode="return">回程检查</button></div>`+checklist(checkMode==='pre'?DATA.pre:DATA.return,checkMode,checkMode==='pre'?'出发前 Checklist':'回程前 Checklist');}
function checklist(obj,prefix,title){const keys=Object.entries(obj).flatMap(([g,items])=>items.map((_,i)=>`${prefix}-${g}-${i}`));return `<section class="section"><h2>${title}</h2><p class="sub">点击方框勾选；进度自动保存在当前浏览器。</p>${progress(keys)}${Object.entries(obj).map(([g,items])=>`<div class="group"><div class="gtitle">${esc(g)} <span>${items.filter((_,i)=>checked[`${prefix}-${g}-${i}`]).length}/${items.length}</span></div>${items.map((v,i)=>check(`${prefix}-${g}-${i}`,v)).join('')}</div>`).join('')}<div class="tools"><button class="tool" data-export="${prefix}">复制未完成事项</button></div></section>`}
const RESTAURANTS=[{"meal":"午餐","name":"Krua Apsorn（Dusit）","zh":"阿颂厨房","award":"米其林必比登（官网现列）","dish":"辣椒炒猪肉 · Stir-fried Pork with Bird’s-eye Chilli","desc":"米其林推荐的家常泰菜；辣椒可请店家减量。","q":"Krua Apsorn Dusit Bangkok","source":"https://guide.michelin.com/th/en/article/dining-out/5-must-try-bib-gourmand-restaurants-in-bangkok-from-the-michelin-guide-thailand-2025"},{"meal":"午餐","name":"Polo Fried Chicken (Soi Polo)","zh":"Polo 炸鸡","award":"米其林必比登（米其林历史推荐）","dish":"蒜香炸鸡＋糯米饭＋青木瓜沙拉 · Garlic Fried Chicken, Sticky Rice & Som Tam","desc":"靠近伦坡尼公园；奖项年份以官方最新页面为准。","q":"Polo Fried Chicken Soi Polo Bangkok","source":"https://guide.michelin.com/th/en/article/travel/2-days-in-bangkok"},{"meal":"午餐","name":"Pad Thai Fai Ta Lu (Phra Nakhon)","zh":"火焰泰式炒河粉","award":"米其林必比登（官网名单）","dish":"泰式炒河粉 · Pad Thai","desc":"适合老城区游览时午餐；以当日菜单为准。","q":"Pad Thai Fai Ta Lu Phra Nakhon Bangkok","source":"https://guide.michelin.com/th/en/bangkok-region/bangkok/restaurants/bib-gourmand"},{"meal":"午餐","name":"K. Panich","zh":"K. Panich 甜品老店","award":"米其林必比登（官网名单）","dish":"芒果糯米饭 · Mango Sticky Rice","desc":"适合午餐后分享甜品；糖和糯米较多，控制份量。","q":"K Panich Bangkok mango sticky rice","source":"https://guide.michelin.com/th/en/bangkok-region/bangkok/restaurants/bib-gourmand"},{"meal":"晚餐","name":"Jay Fai","zh":"痣姐海鲜街头料理","award":"米其林一星（2026）","dish":"蟹肉煎蛋 · Crab Omelette","desc":"价格较高、排队或预约可能困难；不建议作为必须完成的行程。","q":"Jay Fai Bangkok","source":"https://guide.michelin.com/tw/en/article/michelin-guide-ceremony/full-list-michelin-stars-michelin-guide-thailand-2026"},{"meal":"晚餐","name":"Somsak Pu Ob (Charoen Rat)","zh":"Somsak 焗蟹虾粉丝","award":"米其林必比登（官网名单）","dish":"焗蟹／焗虾粉丝 · Crab or Prawn with Glass Noodles","desc":"适合分享的海鲜晚餐；注意是否为所列分店。","q":"Somsak Pu Ob Charoen Rat Bangkok","source":"https://guide.michelin.com/th/en/bangkok-region/bangkok/restaurants/bib-gourmand"},{"meal":"晚餐","name":"Krua Apsorn（Dusit）","zh":"阿颂厨房","award":"米其林必比登（官网现列）","dish":"家常泰菜与辣椒炒猪肉 · Thai Home-style Dishes","desc":"适合多人分享；营业时间及晚餐供应请核实。","q":"Krua Apsorn Dusit Bangkok","source":"https://guide.michelin.com/th/en/article/dining-out/5-must-try-bib-gourmand-restaurants-in-bangkok-from-the-michelin-guide-thailand-2025"}];
function restaurantSection(){const meals=['午餐','晚餐'];return `<h2 style="margin-top:28px">米其林／必比登餐厅与招牌菜</h2><p class="sub">按午餐、晚餐分类；仅列出有米其林官方资料支持的餐厅。推荐菜是代表性菜品或适合尝试的选择，不代表当日必有供应。点击地图核对营业时间与分店。</p>${meals.map(meal=>`<div class="group"><div class="gtitle">${meal}推荐 · ${meal==='午餐'?'Lunch':'Dinner'}</div>${RESTAURANTS.filter(r=>r.meal===meal).map((r,i)=>`<article class="foodcard restaurant-card"><div class="food-place">${esc(r.zh)}<small class="lang-en">${esc(r.name)}</small></div><div class="foodtag">${esc(r.award)}</div><div class="fooddesc" style="padding-left:0"><b>招牌菜：</b>${esc(r.dish)}<br>${esc(r.desc)}</div><a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.q)}">地图与营业时间 ↗</a>　<a class="maplink" target="_blank" rel="noopener" href="${r.source}">米其林资料 ↗</a></article>`).join('')}</div>`).join('')}`}
function emergency(){const calls=[['报警／一般紧急求助','Police / General Emergency','191','urgent'],['医疗急救／救护车','Ambulance / Medical Emergency','1669','urgent'],['旅游警察（可中文沟通）','Tourist Police','1155',''],['消防','Fire Service','199',''],['中国驻泰国使馆领事保护','Chinese Embassy Consular Assistance','+6622457010',''],['中国外交部领保热线（24小时）','China Consular Protection Hotline','+861012308',''],['中国外交部领保备用电话','Consular Protection Alternate','+861065612308',''],['泰国旅游局咨询','Tourism Authority of Thailand','1672','']];return `<section class="section"><h2>紧急联络 · Emergency</h2><p class="sub">泰国境内电话可直接点击拨打。遇到生命危险先联系当地急救／警方；使馆提供领事协助，不能代替急救。</p><div class="notice">报警 191 · 急救 1669 · 旅游警察 1155（含中文服务）<br>请向接线员说明所在酒店／景点名称及准确位置。</div>${calls.map(([zh,en,num,cls])=>`<article class="emergency-card ${cls}"><h3>${esc(zh)}</h3><div class="sub">${esc(en)}</div><div class="emergency-number">${esc(num)}</div><a class="call-btn" href="tel:${num}">立即拨打 · Call</a></article>`).join('')}<div class="group"><div class="gtitle">向救援人员出示 · Show to staff</div><div class="checkrow emergency-note" style="display:block"><b>中文：</b>请帮我们联系救护车／警察。我们需要中文翻译。<br><b>English:</b> Please call an ambulance / the police. We need a Chinese interpreter.<br><b>ไทย：</b>กรุณาเรียกรถพยาบาล / ตำรวจให้ด้วย เราต้องการล่ามภาษาจีน</div></div><div class="group"><div class="gtitle">使馆地址 · Embassy address</div><div class="checkrow" style="display:block">中国驻泰国大使馆<br>Embassy of the People's Republic of China<br>57 Ratchadaphisek Road, Bangkok 10400, Thailand<br><a class="maplink" href="https://www.google.com/maps/search/?api=1&query=Embassy%20of%20China%2057%20Ratchadaphisek%20Road%20Bangkok" target="_blank" rel="noopener">查看地图 ↗</a></div></div><div class="notice">信息来源：泰国旅游局、中国驻泰国使馆（2026年公告）。国际电话可能产生费用；出发前请核实号码及旅行保险的紧急联系电话。</div><div class="footer"><a target="_blank" rel="noopener" href="https://www.tourismthailand.org/Plan-Your-Trip/Useful-Call">泰国旅游局紧急电话</a> · <a target="_blank" rel="noopener" href="https://th.china-embassy.gov.cn/sgxw/202609/t20260902_12014753.html">中国驻泰使馆官方公告</a></div></section>`}
function food(){const cats=['全部','午餐简餐','晚餐正餐','下酒小菜','小吃饮品'];const list=DATA.food.map((x,i)=>({...x,i})).filter(x=>state.food==='全部'||x.category===state.food);const keys=DATA.food.map((_,i)=>`food-${i}`);return `<section class="section"><h2>泰国特色美食打卡</h2><p class="sub">以菜式为单位勾选，适合边旅行边记录。标注“相对友好”并不等于低GI认证；主食份量、甜酱和饮品仍会影响血糖。</p>${progress(keys)}<div class="foodfilters">${cats.map(c=>`<button class="filter ${c===state.food?'active':''}" data-food="${c}">${c}</button>`).join('')}</div>${list.map(x=>`<div class="foodcard">${check(`food-${x.i}`,x.name)}<div class="fooddesc">${esc(x.desc)}</div><span class="foodtag ${/风险|碳水较多/.test(x.tag)?'warn':''}">${esc(x.tag)}</span></div>`).join('')}${restaurantSection()}<div class="notice">生腌虾、血蚶等生食有感染风险，老人建议选择彻底煮熟的版本。饮酒与用药、血糖管理之间可能存在相互影响。</div></section>`}
function update(){document.querySelectorAll('[data-check]').forEach(el=>{const k=el.dataset.check;el.checked=!!checked[k];const text=el.closest('.checkrow')?.querySelector('span')||el.closest('.eventtop')?.querySelector('.eventname');if(text)text.classList.toggle('checked',!!checked[k])});if(state.view!=='days')render(false);else{const d=DATA.days[state.day],keys=d.events.map((_,i)=>`day-${state.day}-${i}`),p=document.querySelector('.section .progress .bar'),s=document.querySelector('.section>.sub + .progress');if(p)p.style.width=`${keys.filter(k=>checked[k]).length/keys.length*100}%`;const txt=document.querySelector('.section .stay + .sub');if(txt)txt.textContent=`已完成 ${keys.filter(k=>checked[k]).length} / ${keys.length}`}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-checkmode]');if(b){checkMode=b.dataset.checkmode;render(false);}});
function render(scroll=true){document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));document.body.classList.toggle('driver-mode',state.view==='address'&&driverIndex!==null);document.getElementById('main').innerHTML=state.view==='days'?day():state.view==='pre'?combinedChecklist():state.view==='food'?food():state.view==='emergency'?emergency():addresses();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
const cache={};async function loadWiki(img){if(img.dataset.loaded)return;img.dataset.loaded='1';let q=img.dataset.wiki;try{if(!cache[q]){const url='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=1&prop=pageimages&pithumbsize=900&format=json&origin=*';const res=await fetch(url);const j=await res.json();cache[q]=Object.values(j.query?.pages||{})[0]?.thumbnail?.source||'';}if(!cache[q])throw Error('No image');img.src=cache[q];img.onerror=()=>{img.style.display='none';document.getElementById(img.dataset.fallback)?.style.setProperty('display','block')}}catch(e){img.style.display='none';document.getElementById(img.dataset.fallback)?.style.setProperty('display','block')}} 
document.addEventListener('click',async e=>{let b=e.target.closest('[data-view],[data-day],[data-food],[data-expand],[data-export],[data-addrcat],[data-showdriver],[data-backdriver],[data-copyaddress]');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;driverIndex=null;render()}else if(b.dataset.addrcat){addressCategory=b.dataset.addrcat;render(false)}else if(b.dataset.showdriver!==undefined){driverIndex=Number(b.dataset.showdriver);render()}else if(b.dataset.backdriver!==undefined){driverIndex=null;render()}else if(b.dataset.copyaddress!==undefined){const a=ADDRESSES[Number(b.dataset.copyaddress)];try{await navigator.clipboard.writeText(a.th+'\n'+a.en+'\n'+a.address);b.textContent='已复制'}catch(err){b.textContent='复制失败'}}else if(b.dataset.day!==undefined){state.day=Number(b.dataset.day);render()}else if(b.dataset.food){state.food=b.dataset.food;render(false)}else if(b.dataset.expand!==undefined){let box=document.getElementById('detail-'+b.dataset.expand);box.classList.toggle('open');b.setAttribute('aria-expanded',box.classList.contains('open'));b.textContent=box.classList.contains('open')?'收起 ↑':'了解 ↗';if(box.classList.contains('open')){const img=box.querySelector('[data-wiki]');if(img)loadWiki(img)}}else if(b.dataset.export){const obj=b.dataset.export==='pre'?DATA.pre:DATA.return;const lines=Object.entries(obj).flatMap(([g,items])=>[g,...items.filter((_,i)=>!checked[`${b.dataset.export}-${g}-${i}`]).map(x=>'☐ '+x)]);try{await navigator.clipboard.writeText(lines.join('\n'));b.textContent='已复制'}catch(e){b.textContent='复制失败，请手动选择'}}});document.addEventListener('change',e=>{if(e.target.dataset.check)setCheck(e.target.dataset.check,e.target.checked)});render();
</script></body></html>
